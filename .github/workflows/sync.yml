name: Sync GitHub repos to Pinecone

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC daily (~08:00 IDT)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python sync.py
        env:
          GH_TOKEN: ${{ secrets.GH_REPO_LIST_TOKEN }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
